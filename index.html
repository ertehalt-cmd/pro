<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EUR/USD Signal Bot</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Tajawal:wght@400;700;900&display=swap');
:root {
  --bg: #080c10;
  --panel: #0d1117;
  --border: #1a2332;
  --accent: #00d4ff;
  --green: #00ff88;
  --red: #ff3355;
  --gold: #ffd700;
  --text: #c9d1d9;
  --dim: #4a5568;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Tajawal', sans-serif;
  min-height: 100vh;
  padding: 10px;
  max-width: 480px;
  margin: 0 auto;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.title { font-size: 17px; font-weight: 900; color: var(--accent); }
.price-box { font-family: 'Share Tech Mono', monospace; font-size: 19px; color: var(--gold); }

.markets {
display: flex;
gap: 6px;
background: var(–panel);
border: 1px solid var(–border);
border-radius: 8px;
padding: 7px 10px;
margin-bottom: 8px;
flex-wrap: wrap;
}
.market { display: flex; align-items: center; gap: 4px; font-size: 12px; font-family: ‘Share Tech Mono’, monospace; }
.dot { width: 8px; height: 8px; border-radius: 50%; }
.dot.open { background: var(–green); box-shadow: 0 0 6px var(–green); }
.dot.closed { background: var(–red); }

/* CHART */
.chart-wrap {
background: #000;
border: 1px solid var(–border);
border-radius: 8px;
overflow: hidden;
margin-bottom: 8px;
position: relative;
}
.chart-label {
position: absolute;
top: 6px;
right: 8px;
font-size: 10px;
color: var(–accent);
z-index: 10;
font-family: ‘Share Tech Mono’, monospace;
background: rgba(8,12,16,0.85);
padding: 2px 7px;
border-radius: 4px;
pointer-events: none;
}
#tv-chart {
width: 100%;
height: 300px;
border: none;
display: block;
}

/* STRATEGIES */
.strategies {
background: var(–panel);
border: 1px solid var(–border);
border-radius: 8px;
padding: 8px 10px;
margin-bottom: 8px;
}
.strat-title { font-size: 11px; color: var(–dim); margin-bottom: 7px; text-align: center; }
.strat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.strat-item {
display: flex;
justify-content: space-between;
align-items: center;
background: #111820;
border-radius: 6px;
padding: 6px 8px;
font-size: 12px;
}
.strat-name { color: var(–text); }
.strat-val {
font-family: ‘Share Tech Mono’, monospace;
font-size: 11px;
padding: 2px 6px;
border-radius: 4px;
}
.strat-val.bull { background: rgba(0,255,136,0.15); color: var(–green); }
.strat-val.bear { background: rgba(255,51,85,0.15); color: var(–red); }
.strat-val.neutral { background: rgba(74,85,104,0.3); color: var(–dim); }
.strat-val.loading { background: rgba(0,212,255,0.1); color: var(–accent); }
.strat-item.full { grid-column: 1 / -1; }

.consensus {
background: var(–panel);
border: 1px solid var(–border);
border-radius: 8px;
padding: 8px 10px;
margin-bottom: 8px;
}
.consensus-label { font-size: 11px; color: var(–dim); margin-bottom: 6px; display: flex; justify-content: space-between; }
.bar-wrap { background: #111820; border-radius: 4px; height: 8px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
.bar-fill.bull { background: linear-gradient(90deg, var(–green), #00aa55); }
.bar-fill.bear { background: linear-gradient(90deg, var(–red), #aa0022); }
.bar-fill.neutral { background: var(–dim); }

.signal-box {
border-radius: 10px;
padding: 14px;
text-align: center;
margin-bottom: 8px;
border: 2px solid transparent;
transition: all 0.4s;
}
.signal-box.buy { background: rgba(0,255,136,0.08); border-color: var(–green); box-shadow: 0 0 20px rgba(0,255,136,0.2); }
.signal-box.sell { background: rgba(255,51,85,0.08); border-color: var(–red); box-shadow: 0 0 20px rgba(255,51,85,0.2); }
.signal-box.wait { background: rgba(74,85,104,0.1); border-color: var(–border); }
.signal-label { font-size: 12px; color: var(–dim); margin-bottom: 4px; }
.signal-main { font-size: 34px; font-weight: 900; letter-spacing: 2px; line-height: 1; margin-bottom: 6px; }
.signal-main.buy { color: var(–green); }
.signal-main.sell { color: var(–red); }
.signal-main.wait { color: var(–dim); }
.signal-meta { display: flex; justify-content: center; gap: 16px; margin-top: 8px; }
.meta-item { text-align: center; }
.meta-label { font-size: 10px; color: var(–dim); }
.meta-val { font-family: ‘Share Tech Mono’, monospace; font-size: 15px; font-weight: 700; }
.meta-val.gold { color: var(–gold); }
.meta-val.accent { color: var(–accent); }

.btn-analyze {
width: 100%;
padding: 13px;
background: linear-gradient(135deg, #0a2a4a, #0d3d6e);
border: 1px solid var(–accent);
border-radius: 8px;
color: var(–accent);
font-family: ‘Tajawal’, sans-serif;
font-size: 16px;
font-weight: 700;
cursor: pointer;
transition: all 0.2s;
margin-bottom: 8px;
}
.btn-analyze:active { transform: scale(0.98); }
.btn-analyze:disabled { opacity: 0.5; cursor: not-allowed; }
.status { text-align: center; font-size: 11px; color: var(–dim); font-family: ‘Share Tech Mono’, monospace; margin-bottom: 4px; }
.pulse { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(–accent); margin-left: 4px; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.3;transform:scale(0.7)} }
.last-update { text-align: center; font-size: 10px; color: var(–dim); font-family: ‘Share Tech Mono’, monospace; }
</style>

</head>
<body>

<div class="header">
  <div class="title">⚡ EUR/USD BOT</div>
  <div class="price-box" id="livePrice">-.-----</div>
</div>

<div class="markets" id="marketHours"></div>

<!-- TRADINGVIEW LIVE CHART -->

<div class="chart-wrap">
  <div class="chart-label">📊 TradingView Live</div>
  <iframe id="tv-chart"
    src="https://s.tradingview.com/widgetembed/?frameElementId=tv-chart&symbol=FX%3AEURUSD&interval=1&hidesidetoolbar=1&hidetoptoolbar=0&symboledit=0&saveimage=0&toolbarbg=0d1117&studies=MAExp%40tv-basicstudies%1FRSI%40tv-basicstudies%1FMACD%40tv-basicstudies%1FBB%40tv-basicstudies%1FStoch%40tv-basicstudies&theme=dark&style=1&timezone=Asia%2FRiyadh&withdateranges=0&showpopupbutton=0&allow_symbol_change=0&calendar=0&hotlist=0&news=0&details=0&locale=ar&utm_source=localhost&utm_medium=widget"
    allowtransparency="true"
    frameborder="0"
    scrolling="no">
  </iframe>
</div>

<div class="strategies">
  <div class="strat-title">المؤشرات — بيانات Twelve Data</div>
  <div class="strat-grid">
    <div class="strat-item"><span class="strat-name">EMA 5/20</span><span class="strat-val loading" id="s-ema">...</span></div>
    <div class="strat-item"><span class="strat-name">RSI 14</span><span class="strat-val loading" id="s-rsi">...</span></div>
    <div class="strat-item"><span class="strat-name">MACD</span><span class="strat-val loading" id="s-macd">...</span></div>
    <div class="strat-item"><span class="strat-name">Bollinger</span><span class="strat-val loading" id="s-bb">...</span></div>
    <div class="strat-item full"><span class="strat-name">Stochastic</span><span class="strat-val loading" id="s-stoch">...</span></div>
  </div>
</div>

<div class="consensus">
  <div class="consensus-label">
    <span>توافق الإشارات</span>
    <span id="consensusText">0/5</span>
  </div>
  <div class="bar-wrap">
    <div class="bar-fill neutral" id="consensusBar" style="width:0%"></div>
  </div>
</div>

<div class="signal-box wait" id="signalBox">
  <div class="signal-label">الإشارة</div>
  <div class="signal-main wait" id="signalMain">اضغط تحليل</div>
  <div class="signal-meta">
    <div class="meta-item">
      <div class="meta-label">المدة</div>
      <div class="meta-val accent" id="sigDuration">--</div>
    </div>
    <div class="meta-item">
      <div class="meta-label">الثقة</div>
      <div class="meta-val gold" id="sigConfidence">--%</div>
    </div>
    <div class="meta-item">
      <div class="meta-label">توافق</div>
      <div class="meta-val accent" id="sigConsensus">-/5</div>
    </div>
  </div>
</div>

<button class="btn-analyze" id="btnAnalyze" onclick="runAnalysis()">🔍 تحليل السوق</button>

<div class="status" id="statusMsg">جاهز</div>
<div class="last-update" id="lastUpdate"></div>

<script>
const API_KEY = 'a16e72269b854e348b1adc5a3e8c3387';
const PROXY = 'https://corsproxy.io/?';

const MARKETS = [
  { name: 'سيدني',   open: 21, close: 6  },
  { name: 'طوكيو',   open: 23, close: 8  },
  { name: 'لندن',    open: 7,  close: 16 },
  { name: 'نيويورك', open: 12, close: 21 },
];

function renderMarkets() {
  const utcH = new Date().getUTCHours();
  document.getElementById('marketHours').innerHTML = MARKETS.map(m => {
    const open = m.open > m.close
      ? (utcH >= m.open || utcH < m.close)
      : (utcH >= m.open && utcH < m.close);
    return `<div class="market"><div class="dot ${open?'open':'closed'}"></div><span>${m.name}</span></div>`;
  }).join('');
}

async function fetchCandles(size = 60) {
  const url = `https://api.twelvedata.com/time_series?symbol=EUR/USD&interval=1min&outputsize=${size}&apikey=${API_KEY}`;
  const res = await fetch(PROXY + encodeURIComponent(url));
  const data = await res.json();
  if (!data.values) throw new Error('no data');
  return data.values.map(v => ({
    close: parseFloat(v.close),
    high:  parseFloat(v.high),
    low:   parseFloat(v.low),
  })).reverse();
}

function calcEMA(arr, p) {
  const k = 2/(p+1); let e = arr[0];
  for(let i=1;i<arr.length;i++) e = arr[i]*k + e*(1-k);
  return e;
}
function calcRSI(c, p=14) {
  let g=0,l=0;
  for(let i=c.length-p;i<c.length;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d;}
  return 100-100/(1+g/(l||0.0001));
}
function calcBB(c, p=20, m=2) {
  const s=c.slice(-p), mn=s.reduce((a,b)=>a+b)/p;
  const std=Math.sqrt(s.reduce((a,b)=>a+(b-mn)**2,0)/p);
  return {upper:mn+m*std, lower:mn-m*std};
}
function calcMACD(c) {
  return calcEMA(c.slice(-26),12) - calcEMA(c,26);
}
function calcStoch(candles, k=14) {
  const s=candles.slice(-k);
  const hi=Math.max(...s.map(c=>c.high)), lo=Math.min(...s.map(c=>c.low));
  return ((s[s.length-1].close-lo)/(hi-lo||0.0001))*100;
}
function setStrat(id, sig, val) {
  const el = document.getElementById(id);
  el.className = `strat-val ${sig}`;
  el.textContent = val;
}

async function runAnalysis() {
  const btn = document.getElementById('btnAnalyze');
  btn.disabled = true;
  setStatus('جاري جلب البيانات...', true);
  ['s-ema','s-rsi','s-macd','s-bb','s-stoch'].forEach(id => {
    const el = document.getElementById(id);
    el.className='strat-val loading'; el.textContent='...';
  });

  try {
    const candles = await fetchCandles(60);
    const closes = candles.map(c=>c.close);
    document.getElementById('livePrice').textContent = closes[closes.length-1].toFixed(5);

    const ema5  = calcEMA(closes.slice(-5), 5);
    const ema20 = calcEMA(closes.slice(-20), 20);
    const emaSig = ema5>ema20?'bull':'bear';
    setStrat('s-ema', emaSig, ema5>ema20?'▲ شراء':'▼ بيع');

    const rsi = calcRSI(closes);
    const rsiSig = rsi<35?'bull':rsi>65?'bear':'neutral';
    setStrat('s-rsi', rsiSig, `${rsi.toFixed(0)} ${rsi<35?'▲':rsi>65?'▼':'—'}`);

    const macd = calcMACD(closes);
    const macdSig = macd>0?'bull':'bear';
    setStrat('s-macd', macdSig, macd>0?'▲ صاعد':'▼ هابط');

    const bb = calcBB(closes);
    const last = closes[closes.length-1];
    const bbSig = last<bb.lower?'bull':last>bb.upper?'bear':'neutral';
    setStrat('s-bb', bbSig, last<bb.lower?'▲ تشبع بيع':last>bb.upper?'▼ تشبع شراء':'وسط');

    const stoch = calcStoch(candles);
    const stochSig = stoch<25?'bull':stoch>75?'bear':'neutral';
    setStrat('s-stoch', stochSig, `${stoch.toFixed(0)} ${stoch<25?'▲':stoch>75?'▼':'—'}`);

    const sigs = [emaSig, rsiSig, macdSig, bbSig, stochSig];
    const bulls = sigs.filter(s=>s==='bull').length;
    const bears = sigs.filter(s=>s==='bear').length;
    const dom = bulls>bears?'bull':bears>bulls?'bear':'neutral';
    const cnt = Math.max(bulls,bears);

    document.getElementById('consensusBar').style.width = (cnt/5*100)+'%';
    document.getElementById('consensusBar').className = `bar-fill ${dom}`;
    document.getElementById('consensusText').textContent = `${cnt}/5`;

    const box = document.getElementById('signalBox');
    const main = document.getElementById('signalMain');

    if(cnt>=4){
      const dir = dom==='bull'?'buy':'sell';
      box.className=`signal-box ${dir}`;
      main.className=`signal-main ${dir}`;
      main.textContent = dir==='buy'?'▲ شراء':'▼ بيع';
      document.getElementById('sigDuration').textContent = cnt===5?'3 دقائق':'2 دقيقة';
      document.getElementById('sigConfidence').textContent = (cnt===5?92:78)+'%';
      document.getElementById('sigConsensus').textContent = cnt+'/5';
    } else if(cnt===3){
      box.className='signal-box wait'; main.className='signal-main wait';
      main.textContent='⚠ ضعيفة';
      document.getElementById('sigDuration').textContent='1 دقيقة';
      document.getElementById('sigConfidence').textContent='55%';
      document.getElementById('sigConsensus').textContent='3/5';
    } else {
      box.className='signal-box wait'; main.className='signal-main wait';
      main.textContent='⏸ انتظر';
      document.getElementById('sigDuration').textContent='--';
      document.getElementById('sigConfidence').textContent='--%';
      document.getElementById('sigConsensus').textContent=cnt+'/5';
    }

    document.getElementById('lastUpdate').textContent =
      `آخر تحديث: ${new Date().toLocaleTimeString('ar')}`;
    setStatus('تم التحليل ✓');

  } catch(e) {
    setStatus('خطأ — تحقق من الاتصال');
    console.error(e);
  }
  btn.disabled = false;
}

function setStatus(msg, loading=false) {
  document.getElementById('statusMsg').innerHTML = msg+(loading?'<span class="pulse"></span>':'');
}

renderMarkets();
setInterval(renderMarkets, 60000);
</script>

</body>
</html>
